<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- YouTube channel art. Content stays inside the 1546x423 area centred at 1280,720 that every device shows. -->
  <rect width="2560" height="1440" fill="#12323c"/>
  <g transform="translate(560 520) scale(6)">
    <polygon points="9,47 27,17 36,32 42,22 55,47" fill="#f4f3eb"/>
    <polygon points="27,17 34,29 27,26 22,30" fill="#8bb6ad"/>
    <line x1="39" y1="35" x2="33" y2="47" stroke="#e86949" stroke-width="4"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="980" y="728" font-size="168" font-weight="700" letter-spacing="-8" fill="#f4f3eb">OpenSkiTime<tspan fill="#e86949">.</tspan></text>
    <text x="986" y="830" font-size="58" fill="#8bb6ad">Free, open-source alpine ski race timing</text>
  </g>
</svg>
