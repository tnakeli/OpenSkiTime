name: Windows release build
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  # Builds and tests the unsigned release. Signing and publication are windows-sign.yml, started by the maintainer.
  package:
    if: github.repository == 'tnakeli/OpenSkiTime'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release source
        shell: pwsh
        run: ./scripts/Assert-ReleaseSource.ps1
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require changelog release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs app $env:RELEASE_VERSION
      - run: dotnet restore OpenSkiTime.slnx -p:SecurityAudit=true
      - run: dotnet test OpenSkiTime.slnx -c Release
      - name: Publish the unsigned application
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Package-Windows.ps1 -Version $env:RELEASE_VERSION -Stage Publish
      # Uploaded before any test runs the packaged processes, so the signing workflow receives the files exactly as built.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          # A re-run of a failed job replaces the artifact instead of failing on the existing name.
          overwrite: true
          path: artifacts/windows/app/
          retention-days: 1
          if-no-files-found: error
      - name: Assemble an unsigned installer and portable package for acceptance
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Pinned Windows runner must provide Inno Setup 6.' }
          New-Item -ItemType Directory -Path artifacts/acceptance | Out-Null
          Copy-Item -LiteralPath artifacts/windows/app -Destination artifacts/acceptance/app -Recurse
          ./scripts/Package-Windows.ps1 -Version $env:RELEASE_VERSION -Stage Assemble -OutputDirectory artifacts/acceptance -Iscc $compiler
      - name: Verify package checksums with sha256sum
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/verify-checksums.sh artifacts/acceptance "OpenSkiTime-$RELEASE_VERSION-win-x64-setup.exe" "OpenSkiTime-$RELEASE_VERSION-win-x64.zip"
      - name: Test packaged child processes without an installed .NET runtime
        shell: pwsh
        run: ./scripts/Test-WindowsPackage.ps1 -PackageDirectory artifacts/acceptance/app
      - name: Verify installer, reinstall and uninstall preservation
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Test-WindowsInstaller.ps1 -Installer "artifacts/acceptance/OpenSkiTime-$env:RELEASE_VERSION-win-x64-setup.exe"
      - name: Next step
        shell: pwsh
        run: |
          "The unsigned build passed. Sign and publish it within one day from the maintainer machine:" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          "node scripts/release-signing.mjs submit $env:GITHUB_REF_NAME" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
