name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'tnakeli/OpenSkiTime'
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release source
        shell: pwsh
        run: ./scripts/Assert-ReleaseSource.ps1
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require changelog release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs app $env:RELEASE_VERSION
      - run: dotnet restore OpenSkiTime.slnx -p:SecurityAudit=true
      - run: dotnet test OpenSkiTime.slnx -c Release
      - name: Build unsigned Windows installer and portable package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Pinned Windows runner must provide Inno Setup 6.' }
          ./scripts/Package-Windows.ps1 -Version $env:RELEASE_VERSION -Iscc $compiler
      - name: Verify package checksums with sha256sum
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/verify-checksums.sh artifacts/windows "OpenSkiTime-$RELEASE_VERSION-win-x64-setup.exe" "OpenSkiTime-$RELEASE_VERSION-win-x64.zip"
      - name: Test packaged child processes without an installed .NET runtime
        shell: pwsh
        run: ./scripts/Test-WindowsPackage.ps1 -PackageDirectory artifacts/windows/app
      - name: Verify installer, reinstall and uninstall preservation
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Test-WindowsInstaller.ps1 -Installer "artifacts/windows/OpenSkiTime-$env:RELEASE_VERSION-win-x64-setup.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.zip
            artifacts/windows/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
  security:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scan-windows
        with:
          artifact: windows-release
      - name: Include security reports and their checksums in release
        run: |
          cp artifacts/security/windows/* artifacts/windows/
          cd artifacts/windows
          sha256sum sbom.cdx.json cve.json cve-gate.txt provenance.txt >> SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          bash scripts/verify-checksums.sh artifacts/windows sbom.cdx.json cve.json cve-gate.txt provenance.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-reviewed-release
          path: artifacts/windows/*
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [package, security]
    environment: production-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-reviewed-release
          path: release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify release checksums before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash source/scripts/verify-checksums.sh release "OpenSkiTime-${RELEASE_TAG#v}-win-x64-setup.exe" "OpenSkiTime-${RELEASE_TAG#v}-win-x64.zip" sbom.cdx.json cve.json cve-gate.txt provenance.txt
      - name: Publish immutable release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          # Application and live server notes come from CHANGELOG.md / CHANGELOG-LIVE.md at the tagged commit.
          node source/scripts/release-notes.mjs app "${RELEASE_TAG#v}" release-notes.md
          # Stable application releases are explicitly "latest" on the Releases page; live-v* releases never are.
          # The website download selects the newest stable vX.Y.Z itself (scripts/read-release.mjs).
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" release/* --repo "$REPOSITORY" --verify-tag --title "OpenSkiTime $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
  website:
    # Previews are offered on the download page until a stable release exists; scripts/read-release.mjs decides.
    needs: [package, publish]
    uses: ./.github/workflows/website.yml
    secrets: inherit
