name: Live deployment
on:
  push:
    tags: ['live-v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (false builds the first image for bootstrap)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-live
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'tnakeli/OpenSkiTime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate publication source
        shell: pwsh
        run: ./scripts/Assert-ReleaseSource.ps1 -Live
      - name: Require changelog release notes
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs live "${RELEASE_TAG#live-v}"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OpenSkiTime.LiveTiming.slnx -p:SecurityAudit=true
      - run: dotnet test OpenSkiTime.LiveTiming.slnx -c Release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: container
        with:
          context: .
          file: src/OpenSkiTime.LiveTiming.Server/Dockerfile
          push: true
          tags: ghcr.io/tnakeli/openskitime-live:${{ github.sha }}
      - name: Record immutable image
        id: image
        env:
          DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          echo "image=ghcr.io/tnakeli/openskitime-live@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/tnakeli/openskitime-live@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  security:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-trivy
      - name: Scan the immutable image used by deployment
        env:
          LIVE_IMAGE: ${{ needs.build.outputs.image }}
        run: bash scripts/scan-security.sh image "$LIVE_IMAGE" artifacts/security/container
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-security
          path: artifacts/security/container/
          retention-days: 30
          if-no-files-found: error
  deploy:
    needs: [build, security]
    if: vars.LIVE_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    environment: production-live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_LIVE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify, restore previous image on failed verification
        shell: pwsh
        env:
          LIVE_IMAGE: ${{ needs.build.outputs.image }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LIVE_APP: ${{ vars.AZURE_LIVE_APP }}
          LIVE_PUBLISHER_KEY: ${{ secrets.LIVE_PUBLISHER_KEY }}
        run: ./deploy/azure/Deploy-Live.ps1 -Image $env:LIVE_IMAGE -ResourceGroup $env:AZURE_RESOURCE_GROUP -AppName $env:AZURE_LIVE_APP
  release:
    # A live-v* tag gets a GitHub release only after its image is deployed and verified.
    needs: [build, deploy]
    if: github.event_name == 'push' && needs.deploy.result == 'success'
    environment: production-live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Publish live server release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          LIVE_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          version="${RELEASE_TAG#live-v}"
          node scripts/release-notes.mjs live "$version" release-notes.md
          # Never "latest" while an application release can be. GitHub still reports this release as latest when no
          # stable application release exists, so the website download must not rely on releases/latest.
          flags=(--latest=false)
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --title "OpenSkiTime Live $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
