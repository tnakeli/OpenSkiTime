name: Live deployment
on:
  push:
    tags: ['live-v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (false builds the first image for bootstrap)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-live
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'tnakeli/OpenSkiTime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate publication source
        shell: pwsh
        run: ./scripts/Assert-ReleaseSource.ps1 -Live
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test rewrite/OpenSkiTime.LiveTiming.slnx -c Release
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: container
        with:
          context: .
          file: rewrite/src/OpenSkiTime.LiveTiming.Server/Dockerfile
          push: true
          tags: ghcr.io/tnakeli/openskitime-live:${{ github.sha }}
      - name: Record immutable image
        id: image
        env:
          DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          echo "image=ghcr.io/tnakeli/openskitime-live@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/tnakeli/openskitime-live@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    if: vars.LIVE_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    environment: production-live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_LIVE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify, restore previous image on failed verification
        shell: pwsh
        env:
          LIVE_IMAGE: ${{ needs.build.outputs.image }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LIVE_APP: ${{ vars.AZURE_LIVE_APP }}
        run: ./deploy/azure/Deploy-Live.ps1 -Image $env:LIVE_IMAGE -ResourceGroup $env:AZURE_RESOURCE_GROUP -AppName $env:AZURE_LIVE_APP
