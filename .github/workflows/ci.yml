name: Checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node website/build.mjs
      - run: node website/check.mjs
      - run: node --test scripts/tests/*.test.mjs
  application:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test rewrite/OpenSkiTime.Rewrite.slnx -c Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
          az bicep build --file deploy/azure/budget.bicep --stdout > /dev/null
          az bicep build --file deploy/live-timing/containerapp.bicep --stdout > /dev/null
