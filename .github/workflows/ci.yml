name: Checks
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        # Pull requests that change only the website or documentation skip the Windows build and container scan.
        # Pushes to master, the weekly schedule and manual runs always verify everything.
        # The pull request checkout is a merge commit, so its first parent is the base branch.
        run: |
          application=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$changed"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(website/|docs/|[^/]+\.md$|\.github/workflows/website\.yml$)'; then
              application=false
            fi
          fi
          echo "application=$application" | tee -a "$GITHUB_OUTPUT"
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node website/build.mjs
      - run: node website/check.mjs
      - run: node --test scripts/tests/*.test.mjs
  application:
    name: Windows tests
    needs: scope
    # Runs unless the scope job positively identified a website/documentation-only change; a failed scope job still runs it.
    if: ${{ !cancelled() && needs.scope.outputs.application != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit all NuGet dependencies (including test tools)
        run: dotnet restore OpenSkiTime.slnx -p:SecurityAudit=true
      - run: dotnet test OpenSkiTime.slnx -c Release --logger "trx;LogFileName=tests.trx"
      - name: Compile and verify a review installer
        shell: pwsh
        run: |
          $version = "0.0.0-preview.$env:GITHUB_RUN_NUMBER"
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Windows runner must provide Inno Setup 6.' }
          ./scripts/Package-Windows.ps1 -Version $version -Iscc $compiler
          ./scripts/Test-WindowsInstaller.ps1 -Installer "artifacts/windows/OpenSkiTime-$version-win-x64-setup.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-review-package
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.zip
            artifacts/windows/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
  linux:
    name: Linux tests
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.application != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Audit all NuGet dependencies (including test tools)
        run: dotnet restore OpenSkiTime.slnx -p:SecurityAudit=true
      - name: Run tests (excluding Windows-only, OCR, and headless UI tests)
        run: dotnet test OpenSkiTime.slnx -c Release --logger "trx;LogFileName=tests.trx" --filter "FullyQualifiedName !~ TimingReceiptOcrTests & FullyQualifiedName !~ TimyUsbTests & FullyQualifiedName !~ CredentialStorageTests & FullyQualifiedName !~ DesktopWorkflowTests"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-linux
          path: '**/TestResults/*.trx'
          retention-days: 7
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
          az bicep build --file deploy/azure/budget.bicep --stdout > /dev/null
          az bicep build --file deploy/live-timing/containerapp.bicep --stdout > /dev/null
  windows-security:
    name: Windows security
    needs: application
    if: ${{ !cancelled() && needs.application.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scan-windows
        with:
          artifact: windows-review-package
  container-security:
    name: Container security
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.application != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-trivy
      - run: docker build -f src/OpenSkiTime.LiveTiming.Server/Dockerfile -t openskitime-scan:ci .
      - run: bash scripts/scan-security.sh image openskitime-scan:ci artifacts/security/container
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-security
          path: artifacts/security/container/
          retention-days: 14
          if-no-files-found: error
