name: Visual previews
on:
  workflow_dispatch:
  push:
    paths:
      - 'website/**'
      - 'assets/icons/**'
      - 'docs/screenshots/**'
      - 'scripts/Capture-PublicScreenshots.py'
      - '.github/workflows/visual-previews.yml'
permissions:
  contents: read
jobs:
  public-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: dotnet build rewrite/src/OpenSkiTime.LiveTiming.Server -c Release
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/Capture-PublicScreenshots.py --website
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-screenshots
          path: artifacts/visual-previews/*.png
          retention-days: 7
          if-no-files-found: error
