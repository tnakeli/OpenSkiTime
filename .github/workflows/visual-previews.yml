name: Visual previews
on:
  workflow_dispatch:
  push:
    paths:
      - 'website/**'
      - 'assets/icons/**'
      - 'docs/screenshots/**'
      - 'scripts/Capture-PublicScreenshots.py'
      - '.github/workflows/visual-previews.yml'
permissions:
  contents: read
jobs:
  public-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: dotnet build src/OpenSkiTime.LiveTiming.Server -c Release
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/Capture-PublicScreenshots.py --website
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-screenshots
          path: artifacts/visual-previews/*.png
          retention-days: 7
          if-no-files-found: error
