name: Scan Windows package
description: Generate a runtime dependency SBOM and CVE reports from the actual portable package
inputs:
  artifact:
    description: Artifact containing the Windows portable ZIP
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: artifacts/windows
    - uses: ./.github/actions/setup-trivy
    - shell: bash
      run: |
        set -euo pipefail
        packages=(artifacts/windows/*.zip)
        test "${#packages[@]}" -eq 1
        unzip -q "${packages[0]}" -d "$RUNNER_TEMP/windows-package"
        bash scripts/scan-security.sh fs "$RUNNER_TEMP/windows-package" artifacts/security/windows
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: windows-security
        path: artifacts/security/windows/
        retention-days: 14
        if-no-files-found: error
