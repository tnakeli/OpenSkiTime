name: Set up Trivy
description: Install a fixed Linux scanner release with an independently pinned checksum
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/openskitime-trivy"
        mkdir -p "$directory"
        curl --fail --location --retry 3 --output "$directory/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
        echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $directory/trivy.tar.gz" | sha256sum --check
        tar -xzf "$directory/trivy.tar.gz" -C "$directory" trivy
        echo "$directory" >> "$GITHUB_PATH"
