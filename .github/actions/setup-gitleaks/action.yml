name: Set up Gitleaks
description: Install a fixed Linux secret scanner release with an independently pinned checksum
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/openskitime-gitleaks"
        mkdir -p "$directory"
        curl --fail --location --retry 3 --output "$directory/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $directory/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
        echo "$directory" >> "$GITHUB_PATH"
